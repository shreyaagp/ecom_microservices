version: '3.9'

services:
  api-gateway:
    build:
      context: .
      dockerfile: docker/api-gateway.Dockerfile
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
      - kafka
      - user-service
      - product-service
      - order-service
      - inventory-service
      - payment-service
      - notification-service
      - search-service

  user-service:
    build:
      context: .
      dockerfile: docker/user-service.Dockerfile
    expose:
      - '3001'
    environment:
      PORT: 3001
      USER_GRPC_URL: 0.0.0.0:50051
    depends_on:
      - postgresql
      - redis

  product-service:
    build:
      context: .
      dockerfile: docker/product-service.Dockerfile
    expose:
      - '3002'
    environment:
      PORT: 3002
    depends_on:
      - mongodb
      - redis
      - elasticsearch

  order-service:
    build:
      context: .
      dockerfile: docker/order-service.Dockerfile
    expose:
      - '3003'
    environment:
      PORT: 3003
    depends_on:
      - postgresql
      - redis
      - kafka

  inventory-service:
    build:
      context: .
      dockerfile: docker/inventory-service.Dockerfile
    expose:
      - '3004'
    environment:
      PORT: 3004
    depends_on:
      - postgresql
      - kafka

  payment-service:
    build:
      context: .
      dockerfile: docker/payment-service.Dockerfile
    expose:
      - '3005'
    environment:
      PORT: 3005
    depends_on:
      - postgresql
      - kafka
      - redis

  notification-service:
    build:
      context: .
      dockerfile: docker/notification-service.Dockerfile
    expose:
      - '3006'
    environment:
      PORT: 3006
    depends_on:
      - kafka
      - redis

  search-service:
    build:
      context: .
      dockerfile: docker/search-service.Dockerfile
    expose:
      - '3007'
    environment:
      PORT: 3007
      ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on:
      - kafka
      - elasticsearch

  postgresql:
    image: postgres:15
    ports:
      - '5432:5432'
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: ecommerce
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7
    ports:
      - '6379:6379'

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - '2181:2181'

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - '9092:9092'
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - '9200:9200'
    volumes:
      - elastic_data:/usr/share/elasticsearch/data

  kafdrop:
    image: obsidiandynamics/kafdrop:4.0.2
    depends_on:
      - kafka
    environment:
      KAFKA_BROKERCONNECT: kafka:9092
    ports:
      - '9000:9000'

volumes:
  postgres_data:
  mongo_data:
  elastic_data:
